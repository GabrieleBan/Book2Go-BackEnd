apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: book2go
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15 # Immagine ufficiale da Docker Hub
          imagePullPolicy: IfNotPresent # Tenta di usare l'immagine locale se presente
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: db-secrets
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: B2G_DB
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          # Readiness e Liveness probes sono importanti per la stabilità
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - user
                - -d
                - b2g_db
            initialDelaySeconds: 45
            periodSeconds: 100
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - user
                - -d
                - b2g_db
            initialDelaySeconds: 45
            periodSeconds: 20
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata-pvc
        - name: initdb
          configMap:
              name: postgres-initdb-config